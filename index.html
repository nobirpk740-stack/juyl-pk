<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juyl Pk VIP Signal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            border-radius: 5px;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Juyl Pk Login</h2>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন">
        <button onclick="checkPass()">লগইন করুন</button>
    </div>

    <script>
        function checkPass() {
            let pass = document.getElementById("passInput").value;
            if(pass === "2580") {
                alert("সঠিক পাসওয়ার্ড! স্বাগতম।");
                // এখানে আপনার প্যানেলের ভেতরের লিংক বা পেজ দিতে পারেন
            } else {
                alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
            }
        }
    </script>

</body>
</html>
